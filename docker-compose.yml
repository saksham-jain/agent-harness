services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      # Loopback only. Qdrant has no authentication here, so this port being on
      # 0.0.0.0 means anything on the LAN can read the corpus AND delete the whole
      # collection - verified, DELETE /collections/<name> returns 200. The services
      # reach it over the compose network by service name, so this only closes the
      # LAN door. A real API key is the remaining half.
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mcp-server:
    build: .
    container_name: mcp-server
    command: ["python", "mcp_server.py"]
    depends_on:
      qdrant:
        condition: service_started
    environment:
      - MCP_HOST=0.0.0.0        # 0.0.0.0 so other containers can reach it
      - MCP_PORT=8000
      - MCP_PATH=/mcp
      - LLM_BASE_URL=http://host.docker.internal:11434/v1   # native Ollama on your Mac
      - LLM_MODEL=qwen2.5:7b
      - FAST_MODEL=${FAST_MODEL:-qwen2.5:1.5b}
      - FAST_MODEL_THRESHOLD=${FAST_MODEL_THRESHOLD:-80}
      - QDRANT_URL=http://qdrant:6333
      - EMBED_MODEL=nomic-embed-text
      - DOCS_DIR=/docs
      - MIN_SCORE=0.5             # relevance floor; tune per embedding model
      - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-512}
      - RETRIEVE_K=${RETRIEVE_K:-4}
      - MAX_CONTEXT_CHARS=${MAX_CONTEXT_CHARS:-12000}
      - ANSWER_CACHE_TTL=${ANSWER_CACHE_TTL:-300}
      - ANSWER_CACHE_SIZE=${ANSWER_CACHE_SIZE:-64}
      - ANSWER_CACHE_FILE=/cache/answers.json
      - LLM_KEEP_ALIVE=${LLM_KEEP_ALIVE:-30m}
      # Auth is off by default so local development needs no setup. Turn it on when
      # anything other than you can reach this container.
      - MCP_AUTH=${MCP_AUTH:-0}
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:-http://mcp-server:8000/mcp}
      - MCP_ISSUER_URL=${MCP_ISSUER_URL:-https://auth.example.com/}
      - MCP_REQUIRED_SCOPES=${MCP_REQUIRED_SCOPES:-docs:read}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_TOKENS_FILE=/run/tokens.json
      # TLS. Generate with `mkcert localhost`. Unset means plain http.
      - MCP_TLS_CERT=${MCP_TLS_CERT:-}
      - MCP_TLS_KEY=${MCP_TLS_KEY:-}
    volumes:
      # Your documents, gitignored. This mount is WRITABLE, which is the first time this
      # server can write to the host.
      #
      # Uploads must land inside DOCS_DIR in any case, because index() prunes anything
      # outside it — a separate upload directory would be deleted by the next
      # refresh_index. The mount cannot stay :ro with a writable uploads/ nested under it:
      # Docker cannot create a mount point inside a read-only bind, and it fails at container
      # start rather than at first write, which is a confusing way to learn it.
      - ${DOCS_DIR:-./docs}:/docs
      # The committed sample corpus, mounted back over the writable directory read-only so a
      # fresh clone indexes something and the sample cannot be altered by the server.
      - ./docs.sample/test.md:/docs/test.md:ro
      # The browser client at `/`. Read-only; the server only ever reads it. Baked into the
      # image too, so this mount is only needed to edit the page without a rebuild.
      - ./web:/work/web:ro
      # upload.py serves the staged upload routes.
      - ./upload.py:/work/upload.py:ro
      # Read-only: the server only ever reads the token table.
      - ./tokens.json:/run/tokens.json:ro
      # Read-only, and gitignored: contains a private key.
      - ./.certs:/certs:ro
      # Writable cache for persisted answer cache. Survives container recreates.
      - ./cache:/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only, and one mapping. The public path is the Tailscale Funnel, which
      # runs on the host and dials 127.0.0.1:8000. Publishing on 0.0.0.0 would be a way
      # *around* the funnel's TLS, so the port is not exposed to the LAN.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # TCP connect only: the server exposes no unauthenticated health route.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mcp-client:
    build: .
    container_name: mcp-client
    command: ["python", "agent_harness_base.py"]
    depends_on:
      mcp-server:
        condition: service_healthy
    profiles: ["client"]         # interactive; launched with `run --rm`
    stdin_open: true
    tty: true
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1   # native Ollama on your Mac
      - LLM_MODEL=qwen2.5:7b
      # Defaults to the in-network address, which is only correct when the origin serves
      # plain HTTP. With the Tailscale Funnel the origin is HTTP bound to 127.0.0.1 and the
      # host allowlist names only the public hostname, so the internal address answers 421.
      # Set MCP_SERVER_URL in .env to the https URL in that case.
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://mcp-server:8000/mcp}
      # Token used by mcp-client. Optional: with no token set, mcp_client reads the first
      # entry from tokens.json (mounted read-only below). Set it only to override which
      # token is used. Note compose does NOT run shell substitution in .env, so a $(...)
      # here would arrive as that literal string.
      - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN:-}
      - MCP_TOKENS_FILE=/run/tokens.json
      - SKILLS_DIR=/work/skills
      - ROUTER_MODEL=qwen2.5:1.5b   # small model gating answer_docs; "" disables
      # Optional LangSmith tracing for the agent loop. Set in .env to enable.
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-agent-harness}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${WORKDIR:-.:/work}       # the agent's working dir, including skills/
      # Read-only, so mcp_client can read a token directly and no secret has to be pasted
      # into .env before every run.
      - ./tokens.json:/run/tokens.json:ro

  index:
    build: .
    command: ["python", "index_docs.py", "/docs"]
    depends_on:
      qdrant:
        condition: service_started
    profiles: ["index"]          # one-shot; run it when documents change
    environment:
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - EMBED_MODEL=nomic-embed-text
      - DOCS_DIR=/docs
      - QDRANT_URL=http://qdrant:6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read-only: the indexer only ever reads documents, writes go to Qdrant.
      # Defaults to the committed sample corpus so a fresh clone indexes something.
      # Set DOCS_DIR=./docs in .env for your own documents; that directory is
      # gitignored, and a missing one makes the indexer refuse rather than prune.
      - ${DOCS_DIR:-./docs.sample}:/docs:ro
